$kind: http-request
name: Login User / Super Admin
description: Authenticates member or executive admin and automatically sets {{token}} variable in Postman.
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@qnoxgym.com",
      "password": "admin123"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set('token', jsonData.token);
          console.log('Saved token to environment:', jsonData.token);
      }
    language: text/javascript
order: 2000
